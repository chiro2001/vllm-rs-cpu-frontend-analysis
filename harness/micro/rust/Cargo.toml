[package]
name = "micro-bench"
version = "0.1.0"
edition = "2021"
publish = false
description = "D 线逐段微基准：serde_json / minijinja / rmp-serde / SSE 回写"

# 依赖版本刻意与 vllm-rs（vLLM 0.26.0 的 rust/ 工作区）对齐，见
# UPSTREAM_PROJECT/vllm/rust/Cargo.toml 的 workspace.dependencies。
# 解析出的实际版本以 Cargo.lock 为准，并写进 data/micro/manifest.json。
[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
serde_tuple = "1.1.3"
serde-json-fmt = "0.1.0"
rmp-serde = "1.3.1"
rmpv = { version = "1.3.1", features = ["with-serde"] }
indexmap = "2.13.0"
minijinja = { version = "2.0", features = [
    "unstable_machinery",
    "json",
    "builtins",
    "loader",
    "loop_controls",
    "preserve_order",
] }
minijinja-contrib = { version = "2.0", features = ["pycompat"] }
# D6：fastokens 的预分词路径（B 线在火焰图里看到 PCRE2 JIT 帧都来自它）。
# 版本与 vLLM 0.26.0 的 workspace.dependencies 一致；关掉默认 hf-hub 特性，
# 只从本地 tokenizer.json 读。
fastokens = { version = "0.2.1", default-features = false }

[profile.release]
debug = false
lto = "thin"
codegen-units = 1
